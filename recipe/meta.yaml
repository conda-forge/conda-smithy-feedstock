{% set version = "2026.9.19" %}

package:
  name: conda-smithy
  version: {{ version }}

source:
  url: https://github.com/conda-forge/conda-smithy/releases/download/v{{ version }}/conda_smithy-{{ version }}.tar.gz
  sha256: 7fdd3f9420b6fab0ab0b9b44643d70d642fcf3c45fd2254c6e00ad5046a4072d

build:
  number: 0
  noarch: python
  string: {{ "win" if win else "unix" }}_pyh{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  script:
    - {{ PYTHON }} -m pip install . --no-deps -vv
    - rm -f "${PREFIX}/bin/conda"           # [not win]
    - del /f /q "%PREFIX%\\Scripts\\conda"  # [win]
  entry_points:
    - feedstocks = conda_smithy.feedstocks:main
    - conda-smithy = conda_smithy.cli:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=80
    - setuptools-scm >=8.1
  run:
    - __unix                          # [unix]
    - __win                           # [win]
    - python >={{ python_min }}
    - backports.strenum
    - cirun >=0.30
    - conda >=22.11.1
    - conda-build >=26.3.0
    - conda-forge-pinning
    - conda-package-handling >=1.9.0
    - exceptiongroup    
    - gitpython
    - git                             # [unix]
    # TODO: Both `git` & `m2-git` on Windows have problems.
    #       For now, install neither. Hopefully we can find
    #       a better solution in the future.
    #- m2-git                          # [win]
    - jinja2
    - jsonschema
    - license-expression
    - libarchive
    # py-rattler's API subject to change, pin to minor
    - py-rattler >=0.22.0,<0.26.0a0
    - pycryptodome
    - pygit2    
    - pygithub >=2,<3
    - rattler-build-conda-compat >=1.4.15,<2.0.0a0
    - referencing    
    - requests
    - ruamel.yaml >=0.16    
    - scrypt
    - setuptools    
    - spdx-license-list-data    
    - tomli >=1.0.0  # for python <3.11, can remove in the future
    - toolz
    - vsts-python-api
  run_constrained:
    # For more details about `shellcheck`, please see this issue.
    # xref: https://github.com/conda-forge/conda-smithy-feedstock/issues/248
    - conda-recipe-manager >=0.9
    - conda-forge-feedstock-ops >=0.20.2
    - pixi >=0.59.0
    - shellcheck

test:
  imports:
    - conda_smithy
    - conda_smithy.ci_register
    - conda_smithy.configure_feedstock
  requires:
    # no python_min here to be able to test smithy as a downstream (e.g. conda-feedstock)
    - python *
    - mock
    - pytest
    - pytest-cov
    - pydantic >=2.11,<3
    - conda-forge-feedstock-ops      # [unix]
    - conda-souschef
    - conda-recipe-manager
    - git >=2
  source_files:
    - tests/
    - pyproject.toml  # for pytest config bits
  commands:
    - python -m conda smithy --help
    - git config --global user.email "conda-smithy@conda-forge.org"
    - git config --global user.name "conda-smithy-tests"
    - python -m pytest tests --ignore tests/test_anaconda_token_rotation.py --ignore tests/test_cli.py -k "not test_maintainer_team_exists and not test_github_actions_pins and not test_maintainer_exists and not test_lint_recipe_parses_spacing and not test_schema_no_empty_properties_for_bot"  # [not win]
    # test that rerender works
    - git clone https://github.com/conda-forge/conda-smithy-feedstock the_feedstock
    - cd the_feedstock
    - python -m conda smithy rerender
    - python -m conda smithy lint --conda-forge

about:
  home: https://github.com/conda-forge/conda-smithy
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: The tool for managing conda-forge feedstocks

extra:
  recipe-maintainers:
    - conda-forge/core
